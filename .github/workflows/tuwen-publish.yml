name: TuWen batch publisher
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tuwen-pages-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Prepare expired removals and queued notes
        id: prepare
        run: python3 .github/scripts/tuwen_batch.py
      - name: Commit entire batch once
        if: steps.prepare.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A posts
          git diff --cached --quiet || git commit -m 'TuWen batch publish and retention cleanup'
          git push origin HEAD:main
      - name: Configure Pages
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _tuwen_site_artifact
      - name: Deploy to GitHub Pages
        if: steps.prepare.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Mark successfully deployed queue jobs as complete
        if: steps.prepare.outputs.changed == 'true' && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r jobid; do
            if [[ "$jobid" =~ ^[a-f0-9]{32}$ ]]; then
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/tuwen-queue/$jobid"
            fi
          done < _tuwen_processed_refs.txt
